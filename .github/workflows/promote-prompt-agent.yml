name: Promote validated prompt agent

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      max-invalid-output:
        type: number
        required: true
      min-task-completion:
        type: number
        required: true
      max-latency-p95:
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: prompt-agent-deployment-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_USE_AZURE_CLI: '1'
      MAX_INVALID_OUTPUT: ${{ inputs.max-invalid-output }}
      MIN_TASK_COMPLETION: ${{ inputs.min-task-completion }}
      MAX_LATENCY_P95: ${{ inputs.max-latency-p95 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: eval/results
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote the validated definition, not a latest version
        run: |
          python src/foundry_cicd.py deploy \
            --release eval/results/candidate.json \
            --output eval/results/deployed.json
      - name: Smoke and scenario tests against the destination version
        run: |
          python src/foundry_cicd.py evaluate \
            --release eval/results/deployed.json \
            --results eval/results/results.json
          python src/foundry_cicd.py gate \
            --max-invalid-output "$MAX_INVALID_OUTPUT" \
            --min-task-completion "$MIN_TASK_COMPLETION" \
            --max-latency-p95 "$MAX_LATENCY_P95"
      - name: Publish destination version and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ inputs.environment }}
          path: |
            eval/results/deployed.json
            eval/results/results.json
          if-no-files-found: warn
