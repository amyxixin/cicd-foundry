name: Prompt Agent CI/CD
run-name: ${{ github.event_name == 'pull_request' && 'validate prompt agent' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'test' && 'deploy test agent') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod' && 'deploy production agent') || 'deploy dev agent' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: Promote through this environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: prompt-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m bandit -r src -ll
      - run: python src/foundry_cicd.py validate
      - run: python -m pytest -v

  ci-evaluate:
    needs: ci-build-validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_USE_AZURE_CLI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create isolated candidate from this commit
        run: |
          python src/foundry_cicd.py deploy \
            --name "release-checklist-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output eval/results/candidate.json
      - name: Evaluate the exact candidate version
        run: |
          python src/foundry_cicd.py evaluate \
            --release eval/results/candidate.json \
            --results eval/results/results.json
      - name: Enforce quality gates
        run: |
          python src/foundry_cicd.py gate \
            --max-invalid-output 0.05 --min-task-completion 0.90
      - name: Publish validated immutable release
        uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: eval/results/candidate.json
          if-no-files-found: error
      - name: Publish evaluation evidence even when gates fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evaluation
          path: eval/results/results.json
          if-no-files-found: warn

  cd-deploy-dev:
    needs: ci-evaluate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-prompt-agent.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    with:
      environment: dev
      max-invalid-output: 0.05
      min-task-completion: 0.90

  cd-deploy-test:
    needs: cd-deploy-dev
    if: github.event_name == 'workflow_dispatch' && inputs.target_env != 'dev'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-prompt-agent.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    with:
      environment: test
      max-invalid-output: 0.03
      min-task-completion: 0.95

  cd-deploy-prod:
    needs: cd-deploy-test
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/promote-prompt-agent.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    with:
      environment: production
      max-invalid-output: 0.03
      min-task-completion: 0.95
